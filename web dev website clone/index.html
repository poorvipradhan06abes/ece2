<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="nav-logo">amazon</div>

    <div class="nav-search">
        <input type="text" placeholder="Search Amazon">
        <button>Search</button>
    </div>

    <div class="nav-links">
        <div>
            <span>Hello, Sign in</span>
            <p>Account & Lists</p>
        </div>
        <div>
            <span>Returns</span>
            <p>& Orders</p>
        </div>
        <div class="cart">🛒 Cart</div>
    </div>
</header>

<!-- Hero Section -->
<section class="hero"></section>

<!-- Products Section -->
<section class="products">
    <div class="product-box">
        <h3>Clothes</h3>
        <img src="https://m.media-amazon.com/images/I/81yPpRZfPCL._AC_UL480_FMwebp_QL65_.jpg" alt="Clothes">
        <a href="#">See more</a>
    </div>

    <div class="product-box">
        <h3>Electronics</h3>
        <img src="https://m.media-amazon.com/images/I/71kJgA7mzyL._AC_UL480_FMwebp_QL65_.jpg" alt="Electronics">
        <a href="#">See more</a>
    </div>

    <div class="product-box">
        <h3>Home & Kitchen</h3>
        <img src="https://m.media-amazon.com/images/I/71bV1vJz9+L._AC_UL480_FMwebp_QL65_.jpg" alt="Home">
        <a href="#">See more</a>
    </div>

    <div class="product-box">
        <h3>Beauty Picks</h3>
        <img src="https://m.media-amazon.com/images/I/61mk5Xksn+L._AC_UL480_FMwebp_QL65_.jpg" alt="Beauty">
        <a href="#">See more</a>
    </div>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 Amazon Clone | College Project</p>
</footer>

</body>
</html>
